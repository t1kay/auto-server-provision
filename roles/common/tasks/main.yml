---
# ============================================
# Role: common
# Applies to: all hosts
# Purpose: Base system configuration
# ============================================

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: packages

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
  tags: packages

# --- devops user with passwordless sudo ---
- name: Create devops user
  ansible.builtin.user:
    name: "{{ devops_user }}"
    shell: "{{ devops_shell }}"
    groups: sudo
    append: true
    create_home: true
    state: present
  tags: users

- name: Allow devops user passwordless sudo
  ansible.builtin.copy:
    content: "{{ devops_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ devops_user }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags: users

# --- System settings (need systemd, skipped in container lab) ---
- name: Configure hostname, timezone and time sync
  when: not is_container_lab
  tags: system
  block:
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Set timezone to {{ server_timezone }}
      community.general.timezone:
        name: "{{ server_timezone }}"

    - name: Ensure systemd-timesyncd is started and enabled
      ansible.builtin.systemd:
        name: systemd-timesyncd
        state: started
        enabled: true
