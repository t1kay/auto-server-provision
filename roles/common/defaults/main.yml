---
# ============================================
# Role: common — Default variables
# Override these in inventories/<env>/group_vars
# ============================================

# Set to true when targets are containers (Docker lab): skips tasks that
# need systemd / kernel privileges (hostname, timezone, service restarts).
is_container_lab: false

# --- User Configuration ---
devops_user: devops
devops_shell: /bin/bash

# --- System Configuration ---
server_timezone: Asia/Ho_Chi_Minh

# --- Packages installed on ALL nodes ---
common_packages:
  - vim
  - curl
  - wget
  - htop
  - git
  - net-tools
  - unzip
