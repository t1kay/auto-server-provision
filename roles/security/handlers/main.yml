---
# In the container lab sshd runs as PID 1 (no systemd), so a restart
# would kill the container; the new config is picked up on next start.
- name: Restart sshd
  ansible.builtin.service:
    name: ssh
    state: restarted
  when: not is_container_lab

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted
