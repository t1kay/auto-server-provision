---
# ============================================
# Role: security
# Applies to: all hosts
# Purpose: SSH hardening, UFW firewall, fail2ban
# ============================================

- name: Harden SSH daemon
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: "sshd -t -f %s"
  notify: Restart sshd
  when: not skip_ssh_hardening
  tags: ssh

- name: Configure UFW firewall
  when: not skip_firewall
  tags: firewall
  block:
    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present

    # Allow SSH first so enabling the firewall can never lock us out
    - name: Allow SSH on port {{ ssh_port }}
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port | string }}"
        proto: tcp
        comment: SSH

    - name: Allow additional ports
      community.general.ufw:
        rule: allow
        port: "{{ item.port | string }}"
        proto: "{{ item.proto | default('tcp') }}"
        comment: "{{ item.comment | default(omit) }}"
      loop: "{{ ufw_allowed_ports }}"
      loop_control:
        label: "{{ item.port }}/{{ item.proto | default('tcp') }}"

    - name: Set default policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: "{{ ufw_default_incoming }}" }
        - { direction: outgoing, policy: "{{ ufw_default_outgoing }}" }

    - name: Enable UFW
      community.general.ufw:
        state: enabled

- name: Configure fail2ban
  when: not skip_fail2ban
  tags: fail2ban
  block:
    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban
        state: present

    - name: Deploy jail.local
      ansible.builtin.template:
        src: jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban

    - name: Ensure fail2ban is started and enabled
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true
