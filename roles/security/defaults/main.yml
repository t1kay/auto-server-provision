---
# ============================================
# Role: security — Default variables
# Override these in inventories/<env>/group_vars
# ============================================

is_container_lab: false

# --- Feature toggles ---
skip_ssh_hardening: false
skip_firewall: false
skip_fail2ban: false

# --- SSH Hardening ---
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_pubkey_authentication: "yes"
ssh_max_auth_tries: 3
ssh_x11_forwarding: "no"
ssh_login_grace_time: 60

# --- UFW Firewall ---
# SSH ({{ ssh_port }}) is always allowed; list only extra ports here.
ufw_default_incoming: deny
ufw_default_outgoing: allow
ufw_allowed_ports:
  - { port: 80, proto: tcp, comment: HTTP }

# --- Fail2ban ---
fail2ban_maxretry: 5
fail2ban_bantime: 3600
fail2ban_findtime: 600
