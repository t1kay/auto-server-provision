---
# ============================================
# Role: docker
# Purpose: Installs Docker and Docker Compose
# ============================================

# --- Install prerequisite packages ---
- name: Install Docker prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes
  tags: docker, packages

# --- Create keyrings directory ---
- name: Ensure /etc/apt/keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: docker

# --- Add Docker's official GPG key ---
- name: Add Docker's official GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: yes
  tags: docker

# --- Set up Docker stable repository ---
- name: Set up Docker repository
  apt_repository:
    repo: "deb [arch={{ ansible_architecture | default('amd64') | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
    update_cache: yes
  tags: docker

# --- Install Docker Engine and Compose plugin ---
- name: Install Docker Engine and plugins
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  tags: docker, packages

# --- Start and enable Docker service ---
- name: Ensure Docker service is started and enabled
  service:
    name: docker
    state: started
    enabled: yes
  when: env != 'docker'
  tags: docker

# --- Create docker group ---
- name: Ensure docker group exists
  group:
    name: docker
    state: present
  tags: docker

# --- Add users to docker group ---
- name: Add configured users to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users }}"
  when: item is defined and item | length > 0
  tags: docker
