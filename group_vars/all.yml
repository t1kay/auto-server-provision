---
# ============================================
# Global variables for all hosts
# These are shared defaults; override per-env
# in inventories/<env>/group_vars/all.yml
# ============================================

# --- Environment ---
env: dev

# --- User Configuration ---
devops_user: devops
devops_shell: /bin/bash

# --- System Configuration ---
server_timezone: Asia/Ho_Chi_Minh

# --- Common packages (installed on ALL nodes) ---
common_packages:
  - vim
  - curl
  - wget
  - htop
  - git
  - net-tools
  - unzip

# --- Web server packages (installed on webservers group) ---
web_packages:
  - nginx

# --- Nginx Configuration ---
nginx_port: 80
nginx_server_name: "_"
nginx_root: "/var/www/html"
nginx_worker_processes: "auto"
nginx_worker_connections: 768
nginx_enable_gzip: true
nginx_enable_rate_limit: false
nginx_enable_ssl: false
nginx_custom_headers: []
nginx_upstream_servers: []
