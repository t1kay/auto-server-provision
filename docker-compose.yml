---
# Local lab: 1 Ansible control node + 2 Ubuntu targets.
# SSH keys are generated at start-up into the `lab-keys` volume (never committed).

x-node: &node
  build:
    context: ./docker
    dockerfile: Dockerfile.node
  volumes:
    - lab-keys:/keys:ro
  depends_on:
    - ansible-control
  networks:
    - ansible-net

services:
  ansible-control:
    build:
      context: ./docker
      dockerfile: Dockerfile.control
    container_name: ansible-control
    environment:
      - ANSIBLE_CONFIG=/workspace/ansible.cfg
    volumes:
      - .:/workspace
      - lab-keys:/keys
    networks:
      - ansible-net

  web01:
    <<: *node
    container_name: web01
    hostname: web01
    ports:
      - "8080:8080"   # nginx (docker env)
      - "2221:22"

  db01:
    <<: *node
    container_name: db01
    hostname: db01
    ports:
      - "2222:22"

volumes:
  lab-keys:

networks:
  ansible-net:
    driver: bridge
