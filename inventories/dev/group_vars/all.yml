---
# ============================================
# DEV environment — only values that differ from role defaults
# ============================================

env: dev

# --- Nginx ---
nginx_port: 8080
nginx_server_name: dev.local
nginx_worker_processes: 1
nginx_worker_connections: 256
nginx_enable_gzip: false
nginx_custom_headers:
  - { name: X-Environment, value: development }
  - { name: X-Debug-Mode, value: enabled }
nginx_upstream_servers:
  - 127.0.0.1:3000

# --- Firewall (SSH is always allowed) ---
ufw_allowed_ports:
  - { port: 8080, proto: tcp, comment: HTTP (dev) }

# --- SSH: relaxed for easier debugging ---
ssh_password_authentication: "yes"
ssh_max_auth_tries: 6

# --- Fail2ban: lenient ---
fail2ban_maxretry: 10
fail2ban_bantime: 600
