---
# ============================================
# DEV Environment Variables
# Overrides defaults for development/testing
# ============================================

# --- Environment ---
env: dev

# --- Nginx (Dev) ---
nginx_port: 8080
nginx_server_name: "dev.local"
nginx_worker_processes: 1
nginx_worker_connections: 256
nginx_enable_gzip: false
nginx_enable_rate_limit: false
nginx_enable_ssl: false
nginx_custom_headers:
  - "X-Environment: development"
  - "X-Debug-Mode: enabled"

# --- Nginx Upstream (Dev — single backend) ---
nginx_upstream_servers:
  - "127.0.0.1:3000"

# --- SSH (Dev — less strict for easier debugging) ---
ssh_permit_root_login: "no"
ssh_password_authentication: "yes"
ssh_max_auth_tries: 6

# --- Fail2ban (Dev — lenient) ---
fail2ban_maxretry: 10
fail2ban_bantime: 600
fail2ban_findtime: 600
