---
# ============================================
# DOCKER lab environment — only values that differ from role defaults
# ============================================

env: docker

# Targets are containers: no systemd, no kernel privileges.
is_container_lab: true
skip_firewall: true   # UFW needs iptables/kernel access
skip_fail2ban: true   # fail2ban needs iptables/kernel access

# --- Nginx ---
nginx_port: 8080
nginx_server_name: docker.local
nginx_worker_processes: 1
nginx_worker_connections: 256
nginx_enable_gzip: false
nginx_custom_headers:
  - { name: X-Environment, value: docker-lab }
  - { name: X-Debug-Mode, value: enabled }
nginx_upstream_servers:
  - 127.0.0.1:3000
