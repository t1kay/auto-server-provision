---
# ============================================
# PROD environment — only values that differ from role defaults
# ============================================

env: prod

# --- Nginx ---
nginx_server_name: example.com
nginx_worker_connections: 1024
nginx_enable_rate_limit: true
nginx_custom_headers:
  - { name: X-Environment, value: production }
nginx_upstream_servers:
  - 127.0.0.1:3000
  - 127.0.0.1:3001

# --- Fail2ban: aggressive ---
fail2ban_maxretry: 3
fail2ban_bantime: 86400
fail2ban_findtime: 3600
