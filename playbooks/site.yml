---
# ============================================
# Main playbook: provisions every server in the inventory
# ============================================
# Usage:
#   ansible-playbook playbooks/site.yml                                (dev, from ansible.cfg)
#   ansible-playbook -i inventories/prod/hosts.ini playbooks/site.yml   (prod)
#   ansible-playbook playbooks/site.yml --check --diff                 (dry run)
#   ansible-playbook playbooks/site.yml --tags nginx                   (one role only)
# ============================================

- name: Base system configuration
  hosts: all
  become: true
  roles:
    - role: common
      tags: common

- name: Security hardening
  hosts: all
  become: true
  roles:
    - role: security
      tags: security

- name: Docker Engine
  hosts: all
  become: true
  roles:
    - role: docker
      tags: docker

- name: Web servers
  hosts: webservers
  become: true
  roles:
    - role: nginx
      tags: nginx
