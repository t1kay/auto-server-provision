---
name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install ansible-core ansible-lint yamllint
          ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check (all inventories)
        run: |
          for env in dev prod docker; do
            ansible-playbook -i "inventories/$env/hosts.ini" playbooks/site.yml --syntax-check
          done

      - name: shellcheck
        run: shellcheck scripts/*.sh docker/*.sh
